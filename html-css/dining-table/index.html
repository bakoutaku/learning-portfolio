<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <title>ある日の食卓</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="wrapper">
            <header>
                <h1>ある日の食卓</h1>
                <div class="mainvisual">
                    <img src="images/mainvisual.jpg" alt="メインビジュアル：燃えている肉">
                </div><!--/.item-img-->
            </header>
            <div class="contents"><!--Flexコンテナー（親要素）-->
                <main><!--Flexアイテム（子要素：左）-->
                    <article><!--食事１つ目-->
                        <h2>馬肉と鹿肉のカレー</h2>
                        <div class="item-img">
                            <img src="images/curry.jpg" alt="馬肉と鹿肉のカレー">
                        </div>
                            <p>馬肉と鹿肉を使ったカレーです。肉の種類によって味や食感の違いがあります。</p>
                    </article>
                    <article><!--食事２つ目-->
                        <h2>牛肉と豚肉の盛り合わせ</h2>
                        <div class="item-img">
                            <img src="images/meat.jpg" alt="牛肉と豚肉の盛り合わせ">
                        </div>
                            <p>牛肉と豚肉を一皿に盛り付けた料理です。</p>
                    </article>
                    <article><!--食事３つ目-->
                        <h2>刺身の盛り合わせ</h2>
                        <div class="item-img">
                            <img src="images/sashimi.jpg" alt="刺身の盛り合わせ">
                        </div>
                            <p>数種類の魚を盛り合わせた刺身です。</p>
                    </article>
                </main>
                <aside><!--Flexアイテム（子要素：右）-->
                    <section>
                        <h3>よく作った料理</h3>
                        <ul>
                            <li>ステーキ</li>
                            <li>カレー</li>
                            <li>野菜の麺</li>
                        </ul>
                    </section>
                    <section>
                        <h3>好きな料理</h3>
                        <ol>
                            <li>唐揚げ</li>
                            <li>寿司</li>
                            <li>ステーキ</li>
                        </ol>
                    </section>
                </aside>
            </div><!--/.contents-->
            <footer>
                <small>ある日の食卓<br>
                © 2026 bakoutaku</small>
            </footer>
        </div><!--/.wrapper-->
    </body>
</html>
